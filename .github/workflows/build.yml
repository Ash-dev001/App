name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          if [ -f omnidrop_web_application.html ]; then
            cp omnidrop_web_application.html www/index.html
          elif [ -f index.html ]; then
            cp index.html www/index.html
          fi

      - name: Initialize Project & Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init OmniDrop com.omnidrop.app --web-dir www
          npx cap add android

      - name: Configure Android Permissions
        run: |
          cat << 'EOF' > update_manifest.js
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let manifest = fs.readFileSync(path, 'utf8');
          const permissions = `
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
          `;
          manifest = manifest.replace('<application', permissions + '\n    <application');
          fs.writeFileSync(path, manifest);
          EOF
          node update_manifest.js

      - name: Sync Web Code to Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniDrop-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
